# Netlify のビルド設定。Next.js は Netlify が自動で検出し、サーバー機能も含めてデプロイする。
# 不動産情報ライブラリの APIキーは、Netlify の環境変数 REINFOLIB_API_KEY に設定する（リポジトリには置かない）。
[build]
  command = "npm run build"
  publish = ".next"
  # 本番デプロイは無料枠のクレジットを使うため、サイトの中身に関係する変更がないときはビルドしない。
  # （README・テスト・GitHub Actions の設定だけの変更など）。終了コード0でビルドを省く。
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- app components lib/*.ts ':!lib/*.test.ts' public package.json package-lock.json next.config.ts netlify.toml"

[build.environment]
  NODE_VERSION = "22"
